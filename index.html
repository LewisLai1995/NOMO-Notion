function pad2(n){ return String(n).padStart(2,'0'); }
function toISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; } // local-time date, never UTC

function hexToRgba(hex,a){ const h=(hex||'#999999').replace('#',''); const full=h.length===3?h.split('').map(c=>c+c).join(''):h; const n=parseInt(full,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function contrastText(hex){ const h=(hex||'#999999').replace('#',''); const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16); const yiq=(r*299+g*587+b*114)/1000; return yiq>=150?'#2B2A28':'#FFFFFF'; }
function isBiweeklyReviewDate(iso){
  const day = new Date(iso+"T00:00:00").getDate();

/* persistence — artifact-safe window.storage API (never localStorage) */
// Firestore 指定儲存的文件 ID
const USER_DOC_ID = "main_user"; 

// 1. 雲端載入 (Load from Firestore)
async function loadState() {
  // 自動等待 Firebase SDK 初始化完成（最多等 5 秒）
  let retries = 0;
  while ((!window.db || !window.doc) && retries < 50) {
    await new Promise(resolve => setTimeout(resolve, 100));
    retries++;
  }

  if (!window.db || !window.doc) {
    console.warn("⚠️ Firebase SDK 載入超時，暫時使用預設資料。");
    normalizeFinanceShape();
    return;
  }

  try {
    const docRef = window.doc(window.db, "appData", USER_DOC_ID);
    const docSnap = await window.getDoc(docRef);
    
    if (docSnap.exists()) {
      Object.assign(state, docSnap.data());
      console.log("☁️ 已成功從 Firebase 讀取雲端資料！");
    } else {
      console.log("☁️ 連線成功！Firebase 目前無舊資料，將以預設資料初始化。");
      await saveState();
    }
  } catch (e) {
    console.error("❌ Firebase 讀取失敗:", e);
  }

  // 確保財務資料結構格式完整
  if (typeof normalizeFinanceShape === "function") {
    normalizeFinanceShape();
  }
}

// 2. 雲端儲存 (Save to Firestore)
async function saveState() {
  if (!window.db || !window.doc) return; 
  try {
    const snap = {
      theme: state.theme,
      roles: state.roles,
      nicknames: state.nicknames,
      agentsEnabled: state.agentsEnabled,
      projects: state.projects,
      todos: state.todos,
      personaEvents: state.personaEvents,
      finance: state.finance,
      financeReviewWindows: state.financeReviewWindows,
      integrations: state.integrations,
      personaCalMonth: state.personaCalMonth,
      projectCalMonth: state.projectCalMonth,
      updatedAt: new Date().toISOString()
    };
    await window.setDoc(window.doc(window.db, "appData", USER_DOC_ID), snap, { merge: true });
    console.log("☁️ 已成功同步至 Firebase 雲端！");
  } catch (e) {
    console.error("❌ Firebase 儲存失敗:", e);
  }
}

}

// A session saved by an earlier version of this app could have `finance` in one of two older
// shapes: a plain object keyed by label, or the later flat-array-of-values-per-date shape.
// Loading either straight into state silently breaks everything in the Reserve page. Detect
// and migrate to the current periods/first-second shape here, once, right after loading.
function isValidFinanceGroup(g){
  return Array.isArray(g) && g.every(item => item && typeof item.first==='object' && typeof item.second==='object');
}
function normalizeFinanceShape(){
  const f = state.finance;
  if(!Array.isArray(f.periods)) f.periods = [];
  const oldDates = Array.isArray(f.dates) ? f.dates : null;
  ['bank','expense','plan'].forEach(key=>{
    if(isValidFinanceGroup(f[key])) return;
    if(Array.isArray(f[key]) && f[key].every(it=>it && Array.isArray(it.values))){
      // migrate the flat values[] shape: one period per old date, all treated as "first" reviews
      if(oldDates && !f.periods.length){
        f.periods = oldDates.map((d,i)=>({id:'pr'+i, month:d.slice(0,7), firstDate:d, secondDate:null}));
      }
      f[key] = f[key].map(it=>{
        const first = {};
        (it.values||[]).forEach((v,i)=>{ if(v!=null && f.periods[i]) first[f.periods[i].id]=v; });
        return { id:it.id, label:it.label, first, second:{} };
      });
    } else if(f[key] && typeof f[key]==='object' && !Array.isArray(f[key])){
      f[key] = Object.entries(f[key]).map(([label,v],i)=> ({ id:key[0]+'legacy'+i, label, first:{}, second:{} }));
    } else {
      f[key] = []; // unrecoverable — start empty rather than crash
    }
  });
  delete f.dates;
}
function periodById(id){ return state.finance.periods.find(p=>p.id===id); }
function latestPeriod(){ const ps=state.finance.periods; return ps.length ? ps[ps.length-1] : null; }
function findOpenPeriod(){ return [...state.finance.periods].reverse().find(p=>p.firstDate && !p.secondDate) || null; }
function lastReviewDateLabel(){
  const p = latestPeriod();
  if(!p) return null;

// "effective" value for a period = second review if it's been done, else the first-review figure.
function effectiveValue(item, periodId){
  if(item.second && item.second[periodId]!=null) return item.second[periodId];
  if(item.first && item.first[periodId]!=null) return item.first[periodId];
  return null;
}
function sumEffective(group, periodId){
  return state.finance[group].reduce((s,item)=> s+(effectiveValue(item,periodId)||0), 0);
}
function sumPhase(group, periodId, phase){
  return state.finance[group].reduce((s,item)=> s+((item[phase] && item[phase][periodId]!=null) ? item[phase][periodId] : 0), 0);
}
function itemsInPeriod(group, periodId){
  return state.finance[group].filter(item => (item.first && item.first[periodId]!=null) || (item.second && item.second[periodId]!=null));
}

// 3. 替代原本舊有的 loadState
async function loadState() {
  if (!window.db || !window.doc) return;
  try {
    const docRef = window.doc(window.db, "appData", USER_DOC_ID);

const PEBBLE_SIZE = { architect:[48,48], sprout:[44,44], stacked:[44,44], catear:[50,50], shiba:[48,44], scholar:[40,48] };
function nomoBlobSVG(variant,w,h,fillColor){
  const size = PEBBLE_SIZE[variant]||[44,44];
  w = w||size[0]; h = h||size[1];
  // viewBox cropped to 46 (not 50) so the stone's own drawn bottom edge sits flush against
  // the SVG's bounding box — the paths' bottoms all land around y=44-46, so this removes the
  // few units of invisible padding that used to make every stone look like it was floating.
  // Cropped to 47.5 (not 46) — architect/sprout/stacked bottom out around y45 but scholar and
  // the rotated catear reach closer to y47 once their 2px stroke is accounted for; 46 was
  // clipping the bottom edge off those two variants.
  return `<svg width="${w}" height="${h}" viewBox="0 0 50 47.5" preserveAspectRatio="none" fill="none">${(PEBBLE_SVG[variant]||PEBBLE_SVG.sprout)(fillColor||'currentColor')}</svg>`;
}

function citySkylineSVG(){
  // Deterministic (not random) so the skyline doesn't jump on every re-render.
  const heights = [58,96,42,124,70,104,46,138,74,52,114,62,98,44,128,60,84,50,118,68,54,104,44,90];
  const vbH = 140, baseY = vbH-1; // ground line pinned to the exact bottom edge (1px margin only to avoid stroke clipping)
  let x = 4, buildings = '';
  heights.forEach((h,i)=>{
    const w = 20 + (i%3)*6;
    const y = baseY-h;
    buildings += `<rect x="${x}" y="${y}" width="${w}" height="${h}" stroke="var(--line)" stroke-width="1"/>`;
    const cols = Math.max(2, Math.floor(w/9)), rows = Math.max(2, Math.floor(h/14));
    for(let r=0;r<rows;r++){
      const wy = y+8+r*13; if(wy>baseY-6) break;
      for(let c=0;c<cols;c++){ const wx=x+5+c*8; if(wx+3>x+w-3) break; buildings += `<rect x="${wx}" y="${wy}" width="3" height="4" fill="var(--line)" opacity="0.5"/>`; }
    }
    if(h>110){ buildings += `<path d="M${x} ${y} L${x+w/2} ${y-16} L${x+w} ${y}" stroke="var(--line)" stroke-width="1"/>`; }
    if(h>120){ buildings += `<line x1="${x+w/2}" y1="${y-16}" x2="${x+w/2}" y2="${y-30}" stroke="var(--line)" stroke-width="1"/><circle cx="${x+w/2}" cy="${y-31}" r="1.6" fill="var(--line)"/>`; }
    x += w+6;
  });
  return `<svg class="city-skyline" viewBox="0 0 ${x+4} ${vbH}" preserveAspectRatio="none" fill="none">
    <line x1="0" y1="${baseY}" x2="${x+4}" y2="${baseY}" stroke="var(--line)" stroke-width="1"/>
    ${buildings}
  </svg>`;
}
const mascotState = ROLE_IDS.reduce((acc,id,i)=>{ acc[id]={x:20+i*90}; return acc; },{});
let mascotWalkTimer = null, openMascot = null;
function initMascotScene(sceneEl){
  if(!sceneEl) return;
  if(mascotWalkTimer){ clearInterval(mascotWalkTimer); mascotWalkTimer=null; }
  renderMascotScene(sceneEl); mascotStep(sceneEl);
  mascotWalkTimer = setInterval(()=>mascotStep(sceneEl), 3800);
}
function mascotStep(sceneEl){
  if(!document.body.contains(sceneEl)){ clearInterval(mascotWalkTimer); mascotWalkTimer=null; return; }
  const w = sceneEl.clientWidth||420; const maxX = Math.max(60,w-72);
  ROLE_IDS.forEach(id=>{
    if(!state.agentsEnabled[id] || openMascot===id) return;
    const cur = mascotState[id];
    // small, gentle roll — 20-45px per step, not a full-width teleport
    const stepMin = 20, stepMax = 45;
    const dir = Math.random()<0.5 ? -1 : 1;
    let nx = cur.x + dir*(stepMin + Math.random()*(stepMax-stepMin));
    nx = Math.max(8, Math.min(maxX, nx));
    const dx = nx - cur.x;
    const node = document.getElementById('mascot-pos-'+id);
    const fig = node && node.querySelector('.mascot-figure');
    if(fig){
      fig.style.setProperty('--jump-dx', dx+'px');
      fig.classList.remove('pebble-idle');
      fig.classList.add('pebble-roll','jumping');
      fig.addEventListener('animationend', function onEnd(){
        fig.classList.remove('pebble-roll','jumping');
        fig.classList.add('pebble-idle');
        fig.style.transform='';
        fig.style.removeProperty('--jump-dx');
        if(node) node.style.left = nx+'px';
      }, {once:true});
    }
    cur.x = nx;
  });
}

function renderMascotScene(sceneEl){
  sceneEl.querySelectorAll('.mascot-pos, .speech-bubble').forEach(n=>n.remove());
  ROLE_IDS.filter(id=>state.agentsEnabled[id]).forEach(id=>{
    const pos = mascotState[id]; const color = state.theme[id];
    const isOpen = openMascot===id;
    const node = el(`<div id="mascot-pos-${id}" class="mascot-pos" style="left:${pos.x}px;">
      <button data-mascot="${id}" class="mascot-figure mascot-wrap ${isOpen?'pebble-wiggle':'pebble-idle'}">${roleSVG(id,color)}</button></div>`);
    if(isOpen){
      const fig=node.querySelector('.mascot-figure');
      fig.addEventListener('animationend', ()=>{ fig.classList.remove('pebble-wiggle'); fig.classList.add('pebble-idle'); }, {once:true});
    }
    sceneEl.appendChild(node);
  });
  sceneEl.querySelectorAll('[data-mascot]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation();
    openMascot = openMascot===b.dataset.mascot?null:b.dataset.mascot; renderMascotScene(sceneEl);
  }));

  // The bubble is a direct child of the scene (not nested inside the stone's own
  // shrink-to-fit wrapper) and positioned purely in scene-pixel coordinates — this avoids
  // the old bug where the wrapper's width silently collapsed to the button's width and
  // threw off every "centered" calculation built on top of it.
  if(openMascot){
    const btn = sceneEl.querySelector(`#mascot-pos-${openMascot} .mascot-figure`);
    if(btn){
      const bubble = el(`<div class="speech-bubble absolute bg-white rounded-xl border p-3.5 fade-in z-20" style="border-color:var(--line);">${bubbleContent(openMascot)}</div>`);
      bubble.style.width = '256px'; bubble.style.maxWidth = '80vw';
      bubble.addEventListener('click', e=> e.stopPropagation());
      sceneEl.appendChild(bubble);
      const sceneRect = sceneEl.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      const bw = bubble.offsetWidth;
      const charCenterX = (btnRect.left - sceneRect.left) + btnRect.width/2;
      const charTop = (btnRect.top - sceneRect.top);
      const margin = 8;
      let bubbleLeft = charCenterX - bw/2;
      bubbleLeft = Math.max(margin, Math.min(bubbleLeft, sceneEl.clientWidth - bw - margin));
      bubble.style.left = bubbleLeft + 'px';
      bubble.style.bottom = (sceneEl.clientHeight - charTop + 14) + 'px';
      bubble.style.setProperty('--arrow-x', (charCenterX - bubbleLeft) + 'px');

      const qp = bubble.querySelector('#qaProjectAdd');
      if(qp) qp.addEventListener('click', e=>{ e.stopPropagation(); const pid=bubble.querySelector('#qaProjectSelect').value; const txt=bubble.querySelector('#qaProjectText').value.trim(); const proj=state.projects.find(p=>p.id===pid); if(txt&&proj){ state.todos.push({id:uid(),text:`「${proj.name}」${txt}`,done:false,date:state.todayISO,agent:"project"}); openMascot=null; commit(); } });
      const ql = bubble.querySelector('#qaLifeAdd');
      if(ql) ql.addEventListener('click', e=>{ e.stopPropagation(); const d=bubble.querySelector('#qaLifeDate').value||state.todayISO; const txt=bubble.querySelector('#qaLifeText').value.trim(); if(txt){ state.personaEvents.push({id:uid(),text:txt,done:false,date:d,kind:"schedule"}); openMascot=null; commit(); } });
    }
  }
  bindMascotOutsideClick(sceneEl);
}
let mascotOutsideClickBound = false;
function bindMascotOutsideClick(sceneEl){
  if(mascotOutsideClickBound) return;
  mascotOutsideClickBound = true;
  // one listener for the page's whole lifetime — always resolves the *current* scene at
  // click-time rather than closing over a specific (possibly stale/detached) node.
  document.addEventListener('click', ()=>{
    if(!openMascot) return;
    openMascot = null;
    const scene = document.getElementById('mascotScene');
    if(scene) renderMascotScene(scene);
  });
}

function promptModal(title, fields, onSubmit){

    inputs[f.key] = row.querySelector('input');

function derivedItemsFor(roleId, dateISO){

}
function weekDates(offset){ const base = addDays(state.todayISO, offset*7); return [...Array(7)].map((_,i)=>addDays(base,i)); }
function countAgentItems(roleId, dateISO){
  if(roleId==="project") return state.projects.filter(p=>!p.settled).reduce((n,p)=>n+p.stages.filter(s=>s.date===dateISO).length,0);

function projectMiniCalendar(){

  nav.append(prev,label,next); head.appendChild(nav); wrap.appendChild(head);

    cell.addEventListener('click', ()=>{

      cell.style.borderColor = state.theme.project; cell.style.background = hexToRgba(state.theme.project,0.1);
      refreshPanel();
    });

  }
  wrap.appendChild(grid); wrap.appendChild(panel); refreshPanel();
  return wrap;

  tabActive.addEventListener('click', ()=>{ state.projectListTab='active'; render(); });
  tabArchive.addEventListener('click', ()=>{ state.projectListTab='archive'; render(); });
  tabs.append(tabActive,tabArchive); topRow.append(addBtn,tabs); wrap.appendChild(topRow);

  if(state.projectListTab==='active'){
    wrap.appendChild(projectMiniCalendar());
    const grid = el(`<div class="grid grid-cols-3 gap-4"></div>`);
    const list = state.projects.filter(p=>!p.settled);
    if(!list.length) grid.appendChild(el(`<div class="text-[13px] col-span-3" style="color:var(--ink-soft)">目前沒有進行中的專案。</div>`));
    list.forEach(p=> grid.appendChild(projectCard(p)));
    wrap.appendChild(grid);
    return wrap;
  }

  // 已結案存檔
  const thisYear = new Date(state.todayISO+"T00:00:00").getFullYear();
  const archived = state.projects.filter(p=>p.settled && p.settlement)
    .map(p=>{
      const revenue = p.dealAmount + (p.settlement.additionalAmount||0);
      const cost = p.settlement.actualCost||0;
      const margin = revenue ? ((revenue-cost)/revenue*100) : 0;
      return {p, revenue, cost, margin, settledAt: p.settledAt||p.constructionDate};
    })
    .sort((a,b)=> b.settledAt.localeCompare(a.settledAt));
  const yearOnes = archived.filter(a=> a.settledAt.slice(0,4)===String(thisYear));
  const totalRevenue = yearOnes.reduce((s,a)=>s+a.revenue,0);
  const avgMargin = yearOnes.length ? yearOnes.reduce((s,a)=>s+a.margin,0)/yearOnes.length : 0;

  const perfBar = el(`<div class="card rounded-xl p-5 mb-6 grid grid-cols-3 gap-4"></div>`);
  const stat=(l,v)=>`<div><div class="text-[10px] font-mono tracking-widest mb-0.5" style="color:var(--ink-soft)">${l}</div><div class="text-[20px] font-display font-bold">${v}</div></div>`;
  perfBar.innerHTML = stat(`${thisYear} 累計總收入`, `NT$ ${Math.round(totalRevenue).toLocaleString()}`) + stat('平均毛利率', `${avgMargin.toFixed(1)}%`) + stat('已結案專案數', `${yearOnes.length} 件`);
  wrap.appendChild(perfBar);

  const list = el(`<div class="flex flex-col gap-3"></div>`);
  if(!archived.length) list.appendChild(el(`<div class="text-[13px]" style="color:var(--ink-soft)">目前沒有已結案的專案。</div>`));
  archived.forEach(({p,revenue,margin,settledAt})=>{
    const marginColor = margin>=31 ? '#4C8B5C' : '#B23A3A';
    const ym = settledAt.slice(0,7).replace('-','/');
    const row = el(`<button class="card rounded-xl p-4 flex items-center justify-between text-left" style="border-left:3px solid ${p.color};">
      <div class="min-w-0"><div class="font-display font-medium text-[14px] truncate">${p.name}</div><div class="text-[11px]" style="color:var(--ink-soft)">${p.client||'—'} · 結案於 ${ym}</div></div>
      <div class="flex items-center gap-5 shrink-0">
        <div class="text-right"><div class="text-[10px] font-mono" style="color:var(--ink-soft)">總收入</div><div class="text-[13px] font-mono font-medium">NT$ ${Math.round(revenue).toLocaleString()}</div></div>
        <div class="text-right"><div class="text-[10px] font-mono" style="color:var(--ink-soft)">毛利率</div><div class="text-[13px] font-mono font-semibold" style="color:${marginColor}">${margin.toFixed(1)}%</div></div>
      </div></button>`);
    row.addEventListener('click', ()=>{ state.detailProjectId=p.id; state.detailTab='main'; render(); });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function csvDownload(filename, rows){
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

    del.addEventListener('click', ()=>{ state.todos = state.todos.filter(x=>x.id!==t.id); row.remove(); saveState(); if(!list.querySelector('.group')) list.appendChild(placeholder()); });

  }

function personaTodoCard(){
  const color = state.theme.life;
  const card = el(`<div class="card rounded-xl p-5 flex flex-col" id="personaTodoCard" style="height:${HOME_COL_H}px;"><div class="text-[13px] font-medium mb-3">${ROLE_META.life.agendaTitle}（${state.nicknames.life}）· 可指定任意日期</div><div class="flex flex-col gap-1.5 overflow-y-auto scrollbar-thin flex-1" id="personaTodoBody"></div></div>`);
  const body = card.querySelector('#personaTodoBody');
  function placeholder(){ return el(`<div class="text-[12px] placeholder-row" style="color:var(--ink-soft)">尚未新增日常待辦事項</div>`); }
  function buildRow(t){
    const row = el(`<div class="flex items-center gap-2 group"></div>`);
    const cb = checkboxEl(t.done, checked=>{ t.done=checked; input.style.color=checked?'var(--ink-soft)':'var(--ink)'; input.style.textDecoration=checked?'line-through':'none'; saveState(); });
    const dateTag = el(`<span class="text-[10px] font-mono shrink-0" style="color:var(--ink-soft)">${fmt(t.date)}</span>`);
    const input = el(`<input type="text" value="${String(t.text).replace(/"/g,'&quot;')}" class="flex-1 min-w-0 bg-transparent border-b border-transparent hover:border-[color:var(--line)] focus:border-[color:var(--ink)] text-[13px] outline-none py-0.5" style="color:${t.done?'var(--ink-soft)':'var(--ink)'};${t.done?'text-decoration:line-through;':''}"/>`);
    input.addEventListener('change', e=>{ t.text=e.target.value; saveState(); });
    const del = el(`<button class="text-[13px] leading-none opacity-0 group-hover:opacity-100 transition-opacity shrink-0 px-1" style="color:var(--ink-soft)">×</button>`);
    del.addEventListener('click', ()=>{ state.personaEvents = state.personaEvents.filter(x=>x.id!==t.id); row.remove(); saveState(); if(!body.querySelector('.group')) body.appendChild(placeholder()); });
    row.append(cb,dateTag,input,del); return row;
  }
  const items = state.personaEvents.filter(e=>eventKind(e)==='todo').sort((a,b)=>a.date.localeCompare(b.date));
  if(!items.length) body.appendChild(placeholder());
  items.forEach(t=> body.appendChild(buildRow(t)));
  const addRow = el(`<div class="flex flex-wrap gap-2 items-center pt-2 mt-2 border-t" style="border-color:var(--line)">
    <input id="ptDate" type="date" value="${state.todayISO}" class="text-[12px] border rounded px-2 py-1.5" style="border-color:var(--line)"/>
    <input id="ptText" type="text" placeholder="輸入待辦內容…" class="flex-1 text-[13px] border rounded-lg px-3 py-2 min-w-[120px]" style="border-color:var(--line)"/>
    <button id="ptAdd" class="text-[12px] px-3 py-1.5 rounded" style="background:${color};color:${contrastText(color)}">＋ 新增</button></div>`);
  const submit = ()=>{
    const d = addRow.querySelector('#ptDate').value || state.todayISO;
    const v = addRow.querySelector('#ptText').value.trim();
    if(!v) return;
    const t = {id:uid(), text:v, done:false, date:d, kind:"todo"};
    state.personaEvents.push(t);
    const ph = body.querySelector('.placeholder-row'); if(ph) ph.remove();
    body.appendChild(buildRow(t));
    addRow.querySelector('#ptText').value='';
    saveState();
  };
  addRow.querySelector('#ptAdd').addEventListener('click', submit);
  addRow.querySelector('#ptText').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  card.appendChild(addRow);
  return card;
}

function buildFinanceSectionEditor(wrap, group, title, sColor, inputs, pendingNew, valueForItem){
  const head = el(`<div class="flex items-center justify-between mt-3 mb-2"><span class="text-[11px] font-mono tracking-widest" style="color:${sColor}">${title}</span></div>`);
  const addBtn = el(`<button type="button" class="text-[11px] shrink-0 ml-3" style="color:${sColor}">＋ 新增名目</button>`);
  head.appendChild(addBtn); wrap.appendChild(head);
  const rowsWrap = el(`<div></div>`); wrap.appendChild(rowsWrap);
  state.finance[group].forEach(item=>{
    const last = valueForItem(item);
    const row = el(`<div class="flex items-center justify-between gap-3 text-[12px] mb-1.5"><span style="color:var(--ink-soft)">${item.label}</span><div class="flex items-center gap-2"><input type="number" value="${last==null?0:last}" class="w-28 border rounded px-2 py-1 text-[13px] text-right" style="border-color:var(--line)"/><button type="button" class="text-[12px]" title="刪除名目">🗑️</button></div></div>`);
    inputs[group][item.id] = row.querySelector('input');
    row.querySelector('button').addEventListener('click', ()=>{ state.finance[group] = state.finance[group].filter(x=>x.id!==item.id); delete inputs[group][item.id]; row.remove(); });
    rowsWrap.appendChild(row);
  });
  addBtn.addEventListener('click', ()=>{
    const row = el(`<div class="flex items-center justify-between gap-3 text-[12px] mb-1.5">
      <input type="text" placeholder="項目名稱" class="flex-1 min-w-0 border-b bg-transparent text-[12px] outline-none py-0.5" style="border-color:var(--line);color:var(--ink)"/>
      <div class="flex items-center gap-2 shrink-0"><input type="number" value="0" placeholder="金額" class="w-28 border rounded px-2 py-1 text-[13px] text-right" style="border-color:var(--line)"/><button type="button" class="text-[12px]" title="移除">🗑️</button></div></div>`);
    const [labelInput, amountInput] = row.querySelectorAll('input');
    const entry = {label:'', input: amountInput};
    labelInput.addEventListener('input', ()=>{ entry.label = labelInput.value.trim(); });
    pendingNew[group].push(entry);
    row.querySelector('button').addEventListener('click', ()=>{ pendingNew[group]=pendingNew[group].filter(x=>x!==entry); row.remove(); });
    rowsWrap.appendChild(row);
    requestAnimationFrame(()=> labelInput.focus());
  });
}

function openFinanceHistoryModal(){
  const color = state.theme.finance; const F = state.finance;

  const wrap = el(`<div style="min-width:320px"></div>`);

  const nav = el(`<div class="flex items-center justify-between mb-4"></div>`);
  const prevBtn = el(`<button class="text-[12px] px-2 py-1 rounded border" style="border-color:var(--line)">‹ 上個月</button>`);
  const label = el(`<span class="text-[13px] font-mono"></span>`);
  const nextBtn = el(`<button class="text-[12px] px-2 py-1 rounded border" style="border-color:var(--line)">下個月 ›</button>`);
  nav.append(prevBtn,label,nextBtn); wrap.appendChild(nav);
  const body = el(`<div class="flex flex-col gap-5 max-h-[55vh] overflow-y-auto scrollbar-thin"></div>`); wrap.appendChild(body);
  function periodBlock(p){
    const box = el(`<div class="border rounded-lg p-3" style="border-color:var(--line)"></div>`);
    const head = el(`<div class="flex items-center justify-between mb-2"></div>`);
    head.innerHTML = `<div class="text-[12px] font-medium">第一次 ${fmt(p.firstDate)}${p.secondDate?` · 第二次 ${fmt(p.secondDate)}`:' · 尚未第二次盤點'}</div>`;
    const delBtn = el(`<button class="text-[11px] shrink-0" style="color:var(--danger)" title="刪除這筆盤點紀錄">🗑️ 刪除</button>`);
    delBtn.addEventListener('click', ()=>{
      confirmModal(`確定要刪除「${fmt(p.firstDate)}」這整筆盤點紀錄嗎？裡面每個項目在這次的第一次／第二次金額都會一併移除，且無法復原。`, ()=>{
        state.finance.periods = state.finance.periods.filter(x=>x.id!==p.id);
        ['bank','expense','plan'].forEach(group=>{ state.finance[group].forEach(item=>{ delete item.first[p.id]; delete item.second[p.id]; }); });
        commit();
        openFinanceHistoryModal(); // reopen fresh so the list reflects the deletion
      }, {okLabel:'確定刪除', color:'var(--danger)'});
    });
    head.appendChild(delBtn); box.appendChild(head);
    function sectionRows(title,c,group){
      const items = itemsInPeriod(group, p.id);
      if(!items.length) return '';
      const diffFn = FINANCE_DIFF_FORMULA[group];
      let rows = `<tr><td colspan="4" class="pt-2 pb-1 text-[10px] font-mono tracking-widest" style="color:${c}">${title}</td></tr>`;
      items.forEach(item=>{
        const f = item.first[p.id], s = item.second[p.id];
        const diff = (f!=null && s!=null) ? diffFn(f,s) : null;
        rows += `<tr><td class="py-0.5 text-[12px] pr-3" style="color:var(--ink-soft)">${item.label}</td>
          <td class="py-0.5 text-[12px] font-mono text-right pr-3">${f==null?'—':f.toLocaleString()}</td>
          <td class="py-0.5 text-[12px] font-mono text-right pr-3">${s==null?'—':s.toLocaleString()}</td>
          <td class="py-0.5 text-[12px] font-mono text-right" style="color:${diff==null?'var(--ink-soft)':(diff>=0?'var(--good)':'var(--danger)')}">${diff==null?'—':(diff>0?'+':'')+diff.toLocaleString()}</td></tr>`;
      });
      return rows;
    }
    const tableHtml = `<table class="w-full min-w-[380px]"><thead><tr><th class="text-left pb-1 text-[10px]" style="color:var(--ink-soft)">項目</th><th class="text-right pb-1 text-[10px] pr-3" style="color:var(--ink-soft)">第一次</th><th class="text-right pb-1 text-[10px] pr-3" style="color:var(--ink-soft)">第二次</th><th class="text-right pb-1 text-[10px]" style="color:var(--ink-soft)">差額</th></tr></thead><tbody>
      ${sectionRows('A．可運用現金流','var(--sage)','bank')}
      ${sectionRows('B．預留常態性支出',color,'expense')}
      ${sectionRows('C．計畫性支出','var(--gold)','plan')}
    </tbody></table>`;
    box.appendChild(el(`<div class="overflow-x-auto scrollbar-thin">${tableHtml}</div>`));
    return box;
  }
  function refresh(){
    const [y,m] = cursor.split('-');
    label.textContent = `${y} 年 ${parseInt(m,10)} 月`;
    const periods = F.periods.filter(p=>p.month===cursor);
    body.innerHTML='';
    if(!periods.length){ body.appendChild(el(`<div class="text-[12px] py-8 text-center" style="color:var(--ink-soft)">這個月沒有盤點紀錄。</div>`)); return; }
    periods.forEach(p=> body.appendChild(periodBlock(p)));
  }
  prevBtn.addEventListener('click', ()=>{ const [y,m]=cursor.split('-').map(Number); const d=new Date(y,m-2,1); cursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; refresh(); });
  nextBtn.addEventListener('click', ()=>{ const [y,m]=cursor.split('-').map(Number); const d=new Date(y,m,1); cursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; refresh(); });
  refresh();
  const footer = el(`<div class="flex justify-end mt-4"><button id="histClose" class="text-[13px] px-4 py-2 rounded-lg border" style="border-color:var(--line)">關閉</button></div>`);
  wrap.appendChild(footer);
  footer.querySelector('#histClose').addEventListener('click', closeModal);
  openModal(wrap);
}

  state.integrations.forEach(it=>{
    const card = el(`<div class="card rounded-xl p-5 flex items-center justify-between"><div><div class="font-medium text-[14px] mb-1">${it.name}</div><div class="text-[12px]" style="color:var(--ink-soft)">${it.desc}</div></div>
      <button class="text-[12px] rounded-full px-3 py-1.5" style="background:${it.connected?'#E7EBE2':'var(--paper-deep)'};color:${it.connected?'var(--sage)':'var(--ink-soft)'}">${it.connected?'● 已連接':'○ 未連接'}</button></div>`);
    card.querySelector('button').addEventListener('click', ()=>{ it.connected=!it.connected; commit(); });
    grid.appendChild(card);
  });
  wrap.appendChild(grid); return wrap;
}

/* ============================================================ INIT ============================================================ */
(async function init(){ await loadState(); render(); })();
</script>
</body>
</html>
